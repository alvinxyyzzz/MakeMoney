name: Update market data

on:
  workflow_dispatch:
  schedule:
    # Tue-Sat 11:20 Taiwan time; US previous regular session has closed.
    - cron: "20 3 * * 2-6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-market-data.yml"
      - "scripts/update_prices.py"
      - "scripts/build_snapshot.cjs"
      - "decision.js"
      - "engine.js"
      - "decision-journal.js"
      - "requirements.txt"
      - "tests/engine.test.cjs"

permissions:
  contents: write

concurrency:
  group: market-data-updater
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download adjusted historical daily data
        run: python scripts/update_prices.py
      - name: Validate JSON schema and core logic
        run: |
          python -m json.tool data/catalog.json > /dev/null
          node scripts/build_snapshot.cjs
          node tests/engine.test.cjs
          node tests/decision.test.cjs
          node tests/journal.test.cjs
      - name: Commit price cache (no personal holdings)
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "MakeMoney Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh adjusted daily bars"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Unable to push after retries" >&2
          exit 1
